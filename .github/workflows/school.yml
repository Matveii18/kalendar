name: Расписание колледжа

# Запускается каждые 5 минут; скрипт сначала спрашивает Supabase, пора ли проверять по графику,
# и в остальное время сразу завершается. «Run workflow» вручную проверяет сразу.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: school
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - name: Проверить расписание
        run: python3 scripts/school_fetch.py
        env:
          COLLEGE_SCHOOL: ${{ secrets.COLLEGE_SCHOOL }}
          COLLEGE_USER: ${{ secrets.COLLEGE_USER }}
          COLLEGE_PASSWORD: ${{ secrets.COLLEGE_PASSWORD }}
          SCHOOL_PUSH_TOKEN: ${{ secrets.SCHOOL_PUSH_TOKEN }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
